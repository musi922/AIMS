_schema-version: 3.3.0
ID: CampusGrantFlow
version: 1.0.0
description: "CampusGrantFlow - SAP CAP + Fiori Application for Grant Management"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: CampusGrantFlow-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: CampusGrantFlow-auth
      - name: CampusGrantFlow-destination
      - name: CampusGrantFlow-db

  - name: CampusGrantFlow-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: CampusGrantFlow-auth
      - name: srv-api
      - name: CampusGrantFlow-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - grantsfoerderfinder.zip
          name: grantsfoerderfinder
          target-path: resources/

  - name: grantsfoerderfinder
    type: html5
    path: app/foerderfinder
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm clean-install
        - npm run build:cf
      supported-platforms: []

  - name: CampusGrantFlow-destinations
    type: com.sap.application.content
    requires:
      - name: CampusGrantFlow-auth
        parameters:
          service-key:
            name: CampusGrantFlow-auth-key
      - name: CampusGrantFlow-html5-repo-host
        parameters:
          service-key:
            name: CampusGrantFlow-html5-repo-host-key
      - name: srv-api
      - name: CampusGrantFlow-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: CampusGrantFlow-html5-repository
              ServiceInstanceName: CampusGrantFlow-html5-repo-host
              ServiceKeyName: CampusGrantFlow-html5-repo-host-key
              sap.cloud.service: CampusGrantFlow.service
            - Name: CampusGrantFlow-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: CampusGrantFlow-auth
              ServiceKeyName: CampusGrantFlow-auth-key
              sap.cloud.service: CampusGrantFlow.service

  - name: CampusGrantFlow-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: CampusGrantFlow-db

resources:
  - name: CampusGrantFlow-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: CampusGrantFlow-auth
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
  - name: CampusGrantFlow-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: CampusGrantFlow-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: CampusGrantFlow-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
